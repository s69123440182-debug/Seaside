<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>A Little Place For You</title>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600&family=Pacifico&display=swap" rel="stylesheet">
<style>
:root{--cream:#fff6e5;--pink:#f9c6d0;--sun:#ff9e6b;--rose:#ff7f9c;--sea:#6fb3d8;--ink:#5b3a3a;color-scheme:light}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;overflow:hidden;background:#fdeee0;color:var(--ink);font-family:'Mali','Sriracha',cursive,sans-serif}
.scr{position:fixed;inset:0;display:none;overflow:hidden}.scr.on{display:block;animation:fade .7s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.btn{border:0;border-radius:999px;padding:14px 30px;font:600 16px 'Mali',cursive;letter-spacing:.06em;color:#fff;background:linear-gradient(135deg,var(--sun),var(--rose));box-shadow:0 8px 22px rgba(255,110,120,.45)}
.btn:active{transform:scale(.95)}.btn:disabled{opacity:.55}
.btn.soft{background:var(--cream);color:var(--ink);box-shadow:0 6px 16px rgba(0,0,0,.18)}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:18px}
/* welcome */
#welcome .bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:saturate(1.15)}
#welcome .tint{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,170,120,.55),rgba(255,140,160,.35) 55%,rgba(40,70,120,.6))}
.sun{position:absolute;top:14%;left:50%;width:150px;height:150px;margin-left:-75px;border-radius:50%;background:radial-gradient(circle,#fff3c4 0,#ffbf80 45%,rgba(255,150,110,0) 72%);animation:pulse 4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.15);opacity:.85}}
h1.title{font:400 40px/1.25 'Pacifico',cursive;color:#fff;text-shadow:0 4px 18px rgba(120,40,60,.55)}
.tag{color:#fff;font-size:16px;line-height:1.7;max-width:300px;text-shadow:0 2px 10px rgba(80,30,50,.6)}
/* map */
.stage{position:absolute;left:50%;top:50%;height:max(100dvh,177.7vw);aspect-ratio:1450/2576;transform:translate(-50%,-50%)}
.stage .photo{position:absolute;inset:0;width:100%;height:100%;display:block}
.glow{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(255,150,110,.28),rgba(255,210,170,.08) 55%,rgba(255,110,150,.25));mix-blend-mode:soft-light}
.hs{position:absolute;transform:translate(-50%,-50%);width:54px;height:54px;border:0;border-radius:50%;font-size:24px;background:rgba(255,255,255,.3);backdrop-filter:blur(2px)}
.hs::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid rgba(255,255,255,.7);animation:ring 2.2s infinite}
@keyframes ring{from{transform:scale(.7);opacity:1}to{transform:scale(1.5);opacity:0}}
.hs .nm{position:absolute;top:100%;left:50%;transform:translateX(-50%);white-space:nowrap;font:600 11px 'Mali';color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.7);margin-top:6px}
.hs.near{background:rgba(255,232,150,.8);box-shadow:0 0 26px 12px rgba(255,220,120,.9);animation:gl 1s infinite alternate}
@keyframes gl{to{box-shadow:0 0 38px 20px rgba(255,200,100,.5)}}
.hs.done{opacity:.6}.hs.done::after{display:none}
#me{position:absolute;width:64px;transform:translate(-50%,-96%);transition:left .85s ease-in-out,top .85s ease-in-out;pointer-events:none;filter:drop-shadow(0 6px 4px rgba(0,0,0,.4));z-index:3}
#me svg{display:block;width:100%}#me.walk svg{animation:bob .3s infinite alternate}
@keyframes bob{to{transform:translateY(-5px) rotate(2deg)}}
.hud{position:fixed;top:calc(10px + env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;z-index:5;pointer-events:none}
.pill{pointer-events:auto;border:0;background:rgba(255,246,229,.92);border-radius:999px;padding:8px 14px;font:600 14px 'Mali';color:var(--ink);box-shadow:0 4px 12px rgba(0,0,0,.2)}
.hint{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:max-content;max-width:88%;background:rgba(255,246,229,.95);padding:12px 18px;border-radius:18px;text-align:center;font-size:15px;line-height:1.5;z-index:5;box-shadow:0 6px 18px rgba(0,0,0,.25)}
#c3d{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.env{display:none}
#unlock .center{z-index:2;justify-content:flex-end;padding-bottom:calc(40px + env(safe-area-inset-bottom));pointer-events:none}#unlock .btn{pointer-events:auto}#unlock .u1,#unlock .u2{color:#fff;text-shadow:0 2px 12px rgba(80,30,60,.7)}
#garden .sun,#gl{display:none}#garden .endt{z-index:2;pointer-events:none}#garden .bar{z-index:3}
.tag,.endt{white-space:pre-line}.pol{padding:12px 12px 74px!important}
#joy{position:fixed;left:22px;bottom:calc(96px + env(safe-area-inset-bottom));width:120px;height:120px;border-radius:50%;background:rgba(255,246,229,.3);border:2px solid rgba(255,255,255,.65);z-index:6;touch-action:none;backdrop-filter:blur(3px)}#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(255,246,229,.92);box-shadow:0 4px 10px rgba(0,0,0,.3);pointer-events:none}
#vig{position:fixed;inset:0;pointer-events:none;z-index:4;background:radial-gradient(ellipse at center,transparent 52%,rgba(50,25,60,.38) 100%),linear-gradient(180deg,rgba(255,170,110,.1),rgba(255,120,160,.08))}
/* modal */
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(60,30,45,.5);z-index:20}.modal.on{display:flex}
.card{background:var(--cream);border-radius:26px;padding:26px 22px;text-align:center;width:min(86%,340px);display:flex;flex-direction:column;gap:14px;align-items:center;animation:pop .55s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.card h2{font:600 22px 'Mali'}.cam{font-size:64px;animation:camin .8s cubic-bezier(.2,1.6,.4,1)}
@keyframes camin{from{transform:scale(0) rotate(-40deg)}}
.flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:30}.flash.go{animation:fl .55s}
@keyframes fl{0%{opacity:0}15%{opacity:1}100%{opacity:0}}
.pol{position:relative;background:#fff;padding:12px 12px 56px;width:240px;box-shadow:0 14px 34px rgba(0,0,0,.4);transform:rotate(-3deg);animation:drop 1s cubic-bezier(.2,1.2,.4,1)}
@keyframes drop{from{transform:translateY(-120%) rotate(12deg);opacity:0}}
.pol img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;animation:dev 2.4s ease-out}
@keyframes dev{from{filter:brightness(2.4) contrast(.2) sepia(1);opacity:.5}}
.pol p{position:absolute;left:10px;right:10px;bottom:9px;font:400 14px/1.3 'Mali';color:#6a4a4a}
.pol small{display:block;font-size:11px;opacity:.7}
.modal .cnt{color:#fff;font-weight:600;font-size:15px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.polwrap{display:flex;flex-direction:column;align-items:center;gap:20px}
/* unlock */
#unlock{background:radial-gradient(circle at 50% 40%,#ffe9c9,#f9c6d0 60%,#c9a5d8)}
.env{position:relative;width:240px;height:160px;background:#f3d3ba;border-radius:6px;box-shadow:0 18px 36px rgba(120,60,70,.35);animation:float 3s ease-in-out infinite;margin-top:60px}
@keyframes float{50%{transform:translateY(-12px)}}
.flap{position:absolute;top:0;left:0;width:100%;height:100px;background:#e8bb9c;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .8s;z-index:3;display:flex;justify-content:center;padding-top:34px;font-size:26px}
.env.open .flap{transform:rotateX(180deg);z-index:0}
.let{position:absolute;left:12px;right:12px;top:10px;height:140px;background:var(--cream);border-radius:3px;transition:transform 1s .5s;z-index:1}
.env.open .let{transform:translateY(-95px)}
.pk{position:absolute;inset:0;background:linear-gradient(160deg,#f6dcc6,#eec3a6);clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%);z-index:2}
.sp{position:absolute;font-size:18px;animation:tw 2s infinite;pointer-events:none}
@keyframes tw{0%,100%{transform:scale(0);opacity:0}50%{transform:scale(1.2);opacity:1}}
.u1{font:600 20px/1.5 'Mali'}.u2{font-size:16px}
/* letter */
#letter{background:linear-gradient(180deg,#ffd9c0,#f9c6d0 60%,#e9c5e8)}
.paper{position:absolute;inset:calc(16px + env(safe-area-inset-top)) 14px calc(86px + env(safe-area-inset-bottom));background:var(--cream);background-image:repeating-linear-gradient(transparent 0 31px,rgba(111,179,216,.25) 31px 32px);border-radius:6px;padding:34px 22px 26px;overflow:auto;box-shadow:0 14px 34px rgba(120,60,70,.35);transform-origin:top;animation:unfold 1.3s ease-out}
@keyframes unfold{from{transform:perspective(800px) rotateX(-75deg) translateY(160px) scale(.6);opacity:0}60%{opacity:1}}
.paper .to{font:600 24px 'Mali';margin-bottom:10px}
.paper .tx{font:400 16px/32px 'Mali';white-space:pre-wrap;color:#4d3434}
.fl1,.fl2{position:absolute;font-size:26px}.fl1{top:6px;right:10px}.fl2{top:6px;left:10px}
.bar{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom));display:flex;gap:12px;justify-content:center}
/* garden */
#garden{background:linear-gradient(180deg,#5d7fc4 0,#ff9e8a 45%,#ffd08a 70%,#7fc8a9 70.1%,#4f9a78)}
#garden .sun{top:38%;width:220px;height:220px;margin-left:-110px}
.fw{position:absolute;transform-origin:bottom;animation:bloom 1.8s cubic-bezier(.2,1.4,.4,1) both;text-align:center}
.fw::after{content:"";display:block;width:3px;height:var(--h);margin:-4px auto 0;background:#3f8a5f;border-radius:2px}
@keyframes bloom{from{transform:scale(0) rotate(-30deg);opacity:0}}
.bf{position:absolute;font-size:26px;animation:fly var(--d) linear infinite var(--dl)}
@keyframes fly{0%{transform:translate(-40px,0) rotate(-10deg)}25%{transform:translate(25vw,-40px) rotate(10deg)}50%{transform:translate(55vw,20px) rotate(-8deg)}75%{transform:translate(80vw,-30px) rotate(8deg)}100%{transform:translate(110vw,0) rotate(-10deg)}}
.endt{position:absolute;top:14%;left:0;right:0;padding:0 28px;text-align:center;font:400 26px/1.5 'Pacifico';color:#fff;text-shadow:0 3px 14px rgba(120,40,60,.6);animation:fade 3s 3s both}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style></head><body>

<section class="scr" id="welcome"><div class="bg"></div><div class="tint"></div><div class="sun"></div>
<div class="center"><h1 class="title" id="wTitle"></h1><p class="tag" id="wTag"></p><button class="btn" id="startBtn"></button></div></section>

<section class="scr" id="map"><canvas id="c3d"></canvas>
<div class="hud"><div class="pill" id="prog"></div><button class="pill" id="restart1" aria-label="Restart game">↺ เริ่มใหม่</button></div>
<div id="joy" aria-label="จอยสติ๊กเดิน"><div id="knob"></div></div><div class="hint" id="hint"></div></section>

<div id="vig"></div><div class="modal" id="modal"></div><div class="flash" id="flash"></div>

<section class="scr" id="unlock"><canvas id="cEnv" class="cv"></canvas><div class="center" id="uc"><div class="env" id="env"><div class="let"></div><div class="flap">💌</div><div class="pk"></div></div>
<p class="u1" id="u1" style="margin-top:44px"></p><p class="u2" id="u2"></p><button class="btn" id="openBtn"></button></div></section>

<section class="scr" id="letter"><div class="paper"><span class="fl1">🌸</span><span class="fl2">🌼</span><div class="to" id="lTo"></div><div class="tx" id="lTx"></div></div>
<div class="bar"><button class="btn soft mus">▶ เล่นเพลง</button><button class="btn" id="contBtn">ต่อไป</button></div></section>

<section class="scr" id="garden"><canvas id="cGar" class="cv"></canvas><div class="sun"></div><div class="endt" id="endT"></div><div id="gl"></div>
<div class="bar"><button class="btn soft mus">▶ เล่นเพลง</button><button class="btn" id="restart2">↺ เริ่มเกมใหม่</button></div></section>

/* ===== WALK CONTROLS: joystick (touch) + WASD/arrow keys ===== */
const keys={};let jx=0,jy=0,lastSpot=null,jid=null;
addEventListener("keydown",e=>{keys[e.key.toLowerCase()]=1});addEventListener("keyup",e=>{keys[e.key.toLowerCase()]=0});
const joy=$("#joy"),kn=$("#knob");
function resetJoy(){jx=jy=0;jid=null;kn.style.transform=""}
function jmove(e){const r=joy.getBoundingClientRect();let dx=(e.clientX-r.left-60)/45,dy=(e.clientY-r.top-60)/45;const m=Math.hypot(dx,dy);if(m>1){dx/=m;dy/=m}jx=dx;jy=dy;kn.style.transform=`translate(${dx*40}px,${dy*40}px)`}
joy.addEventListener("pointerdown",e=>{jid=e.pointerId;joy.setPointerCapture(e.pointerId);jmove(e)});
joy.addEventListener("pointermove",e=>{if(e.pointerId===jid)jmove(e)});
["pointerup","pointercancel"].forEach(n=>joy.addEventListener(n,resetJoy));
function manualMove(dt,t){
  const ix=jx+((keys.d||keys.arrowright)?1:0)-((keys.a||keys.arrowleft)?1:0),iy=jy+((keys.s||keys.arrowdown)?1:0)-((keys.w||keys.arrowup)?1:0);
  let m=Math.hypot(ix,iy);if(m<.12)return false;
  target=null;const p=player.position,y=camYaw,k=Math.min(m,1),dx=-Math.sin(y)*-iy+Math.cos(y)*ix,dz=-Math.cos(y)*-iy+-Math.sin(y)*ix,L=Math.hypot(dx,dz)||1,sp=7.5*k*dt;
  p.x=Math.max(-28,Math.min(28,p.x+dx/L*sp));p.z=Math.max(-4.6,Math.min(30,p.z+dz/L*sp));
  player.rotation.y=Math.atan2(dx,dz);legs[0].rotation.x=Math.sin(t*12)*.7;legs[1].rotation.x=-Math.sin(t*12)*.7;p.y=H(p.x,p.z)+Math.abs(Math.sin(t*12))*.08;
  const s=CONFIG.spots.find(q=>Math.hypot(SP[q.id][0]-p.x,SP[q.id][1]-p.z)<2.8)||null;
  if(s!==lastSpot){lastSpot=s;if(s){if(s.camera&&!S.found.includes(s.id)){busy=true;resetJoy();legs.forEach(l=>l.rotation.x=0);camera(s)}else say(S.found.includes(s.id)?"เก็บความทรงจำตรงนี้ไว้แล้ว 💗":s.hint)}}
  return true}
